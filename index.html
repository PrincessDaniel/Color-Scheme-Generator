<html>
    <head>
        <!-- Google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main>
            <form id="color-scheme-form">
                <input aria-label="Choose a starter color" id="seed-color" type="color">
                <select id="color-scheme-mode" aria-label="Color scheme mode">
                    <option value="monochrome">Monochrome</option>
                    <option value="monochrome-dark">Monochrome-dark</option>
                    <option value="monochrome-light">Monochrome-light</option>
                    <option value="analogic">Analogic</option>
                    <option value="complement">Complement</option>
                    <option value="analogic-complement">Analogic-complement</option>
                    <option value="triad">Triad</option>
                    <option value="quad">Quad</option>
                </select>
                <button id="get-color-btn" type="submit">Get Color Scheme</button>
            </form>
        </main>
        <section id="color-scheme-container">
        </section>
        <span id="copied" hidden>Hex code copied to clipboard</span>
        
        <script src="index.js"></script>
    </body>
</html>
